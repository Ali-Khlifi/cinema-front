# =============================================================================
# GitLab CI/CD — cinema-front
# Pipeline: test → build → publish
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - publish

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm

# -----------------------------------------------------------------------------
# TEST — runs unit tests (Karma/Jasmine) headless
# TODO: remove allow_failure once the pre-existing broken specs are fixed
# (15/18 specs currently fail with NullInjectorError - missing test providers
# like HttpClientTestingModule / RouterTestingModule)
# -----------------------------------------------------------------------------
test:
  stage: test
  image: node:18
  variables:
    CHROME_BIN: /usr/bin/chromium
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# BUILD — production build artifact
# -----------------------------------------------------------------------------
build:
  stage: build
  image: node:18-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build -- --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  needs:
    - job: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# PUBLISH — Docker image to GitLab Container Registry (develop / main only)
# -----------------------------------------------------------------------------
publish:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  needs:
    - job: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
