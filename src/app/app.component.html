<nav class="navbar navbar-inverse">
  <div class="container-fluid">
    <div class="navbar-header custom-navbar">
      <button
        type="button"
        class="navbar-toggle"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-label="Ouvrir le menu"
      >
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" routerLink="/cinemas">
        <img src="./assets/images/logo-site_.png" alt="logo du site" class="navbar-logo custom-logo">
      </a>
    </div>

    <div class="navbar-collapse" [class.is-open]="menuOpen">
      <ul class="nav navbar-nav">
        <li class="active"><a routerLink="/cinemas" (click)="menuOpen = false">CINÉMAS</a></li>
        <!-- P0.4 : masqués tant que les pages n'ont pas de données réelles. Routes conservées. -->
        <!--
        <li class="active"><a routerLink="/films" (click)="menuOpen = false">FILMS</a></li>
        <li class="active"><a routerLink="/evenements" (click)="menuOpen = false">ÉVÉNEMENTS</a></li>
        <li class="active"><a routerLink="/offres" (click)="menuOpen = false">OFFRES</a></li>
        -->
      </ul>
      <ul class="nav navbar-nav navbar-right">
        <li *ngIf="isAuthenticated && userProfile" class="navbar-text">
          <span>Bonjour, {{ userProfile.firstName || userProfile.username }}</span>
        </li>
        <li>
          <button class="btn btn-link navbar-btn" (click)="isAuthenticated ? logout() : login()">
            {{ isAuthenticated ? 'Se déconnecter' : 'Se connecter' }}
          </button>
        </li>
      </ul>
    </div>
  </div>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>
