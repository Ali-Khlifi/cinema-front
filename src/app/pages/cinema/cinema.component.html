<div class="container">
  <div class="col-md-3">
    <h4>Villes</h4>
    <ul *ngIf="villes" class="list-group">
      <!-- Affichage des villes et selection de la ville courante -->
      <li [ngClass]="v == currentVille?'active' : ''" *ngFor="let v of villes" class="list-group-item clickable"
          (click)="OnGetCinema(v)">
        {{v.name}}
      </li>
    </ul>
  </div>
  <div class="col-md-9">
    <div class="panel-default">
      <div class="panel-heading"> Rechercher une cinema !</div>
      <div class="panel-body">
        <div *ngIf="cinemas" class="list-items">
          <div *ngFor="let c of cinemas" class="clickable">
            <a (click)="OnGetSalles(c)"> {{c.name}} </a>
            <p> {{c.nombreSalles}}</p>
          </div>
        </div>
        <div>
          <app-salles [cinema]="currentCinema"></app-salles>
        </div>
      </div>
    </div>
  </div>
</div>
