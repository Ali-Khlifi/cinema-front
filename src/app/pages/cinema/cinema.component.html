<div class="container">
  <div class="col-md-3">
    <ul *ngIf="villes" class="list-group-villes">
      <!-- Display all villes -->
      <li [ngClass]="v == currentVille?'active' : ''" *ngFor="let v of villes" class="list-group-item-villes"
        (click)="OnGetCinema(v)">
        {{v.name}}
      </li>
    </ul>
  </div>
  <div class="col-md-9">
    <div class="panel-default">
      <app-cinema-search 
        [searchTerm]="searchTerm"
        (searchTermChange)="onSearchTermChanged($event)"
      ></app-cinema-search>
      <div class="panel-body">
        <div *ngIf="filteredCinemas" class="list-items">
          <div *ngFor="let c of filteredCinemas" class="cinema-info">
            <a class="cinema-name" (click)="OnNavigateToSalles(c.id)">{{c.name}}</a>
            <div class="cinema-details">
              <p class="nb-salle"> {{c.nombreSalles}} salles</p>
              <p class="cine-adresse">{{c.adresse}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
